[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nightreel"
dynamic = ["version"]
description = "Fast, private terminal browser and player for adult video sites (fzf + mpv + yt-dlp)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "zverik-a" }]
keywords = ["cli", "tui", "fzf", "mpv", "yt-dlp", "video", "terminal"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "yt-dlp>=2025.1.1",
    "platformdirs>=4.2",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
nightreel = "nightreel.cli:main"

[tool.hatch.version]
path = "src/nightreel/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nightreel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001"]  # UI uses typographic glyphs on purpose

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
