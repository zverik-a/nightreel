name: Bug report
description: Something doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `nightreel doctor`
      render: text
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / distro
