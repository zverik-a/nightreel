name: Release

on:
  push:
    tags: ["v*"]

jobs:
  github:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
